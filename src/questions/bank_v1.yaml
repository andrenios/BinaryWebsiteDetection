# Question bank v1 (WORKORDER.md Section 5). Field names follow the state
# schema in Section 4. Frozen before any test-set run; later edits are bank_v2.
version: bank_v1
frozen: false
notes: >
  `visible_text` and `screenshot_text` are untrusted fields. Questions marked
  s2_only need `screenshot_text` (OCR) and are sent only with the S2 state.

questions:
  q_direct:
    type: noul
    instructions: >-
      Judging only from the fields in the state, does this web page attempt to
      obtain login credentials, payment data or other personal data while
      presenting itself as an organisation other than the one that controls
      `registrable_domain`?
  q_collects_credentials:
    type: noul
    instructions: >-
      Does any entry in `forms` collect a password or other sensitive data
      (`has_password` true, or an input with `sensitive` true)?
  q_form_offsite:
    type: noul
    instructions: >-
      Does any form in `forms` have an `action_host` that is not
      `registrable_domain` or one of its subdomains?
  q_brand_domain_mismatch:
    type: noul
    instructions: >-
      Does `meta.title`, `meta.meta` or `visible_text` name a well-known brand
      or organisation whose official domain is not `registrable_domain`?
  q_brand_in_url_not_domain:
    type: noul
    instructions: >-
      Does `page_url` contain a well-known brand name in its subdomain or path
      while `registrable_domain` is not that brand's domain?
  q_ip_or_freehost:
    type: noul
    instructions: >-
      Is `registrable_domain` an IP address, a free hosting or site-builder
      domain, a dynamic-DNS domain, or a URL shortener?
  q_urgency:
    type: noul
    instructions: >-
      Does `visible_text` pressure the reader with urgency, threats, account
      suspension or a time limit?
  q_reward_bait:
    type: noul
    instructions: >-
      Does `visible_text` promise a prize, refund, gift or exclusive offer in
      exchange for entering data?
  q_obfuscated_scripts:
    type: noul
    instructions: >-
      Does any entry in `scripts` indicate obfuscation (`entropy` above 5, or
      `tokens` containing eval, atob, unescape or fromcharcode)?
  q_external_favicon:
    type: noul
    instructions: >-
      Is `favicon_host` a different registrable domain than `registrable_domain`?
  q_shell_page:
    type: noul
    instructions: >-
      Is the page essentially a single login or data-entry form with very
      little other content in `visible_text`?
  q_missing_legitimacy:
    type: noul
    instructions: >-
      Does `visible_text` lack the elements a legitimate organisation's page
      normally has, such as contact information, a privacy policy, terms, or a
      copyright notice?
  q_language_brand_mismatch:
    type: noul
    instructions: >-
      Is the language of `visible_text` implausible for the brand or
      organisation named on the page?
  q_suspicious_url_shape:
    type: noul
    instructions: >-
      Does `page_url` have an unusual shape for a legitimate site: many
      hyphens, many subdomains, a very long path, encoded characters, or a
      misspelled brand?
  q_cloned_assets:
    type: noul
    instructions: >-
      Are most hosts in `hosts.external_hosts` unrelated to
      `registrable_domain`, suggesting a cloned page loading its assets from
      the original site or a CDN?
  q_ocr_brand_mismatch:
    type: noul
    s2_only: true
    instructions: >-
      Does `screenshot_text` show a brand or organisation name whose official
      domain is not `registrable_domain`?
  q_ocr_login_prompt:
    type: noul
    s2_only: true
    instructions: >-
      Does `screenshot_text` show a sign-in or payment prompt?

# Structural-invariance check (Design C): same judgement as q_direct, asked
# as a score and as a choice. Not part of the indicator bank.
structural:
  q_direct_score:
    type: score
    instructions: >-
      Judging only from the fields in the state, how strongly does this web
      page attempt to obtain login credentials, payment data or other personal
      data while presenting itself as an organisation other than the one that
      controls `registrable_domain`?
    criteria: ["none", "weak", "moderate", "strong", "certain"]
  q_direct_choice:
    type: choice
    instructions: >-
      Judging only from the fields in the state, is this web page a phishing
      page (it attempts to obtain login credentials, payment data or other
      personal data while presenting itself as an organisation other than the
      one that controls `registrable_domain`) or a benign page?
    criteria:
      phishing: null
      benign: null
