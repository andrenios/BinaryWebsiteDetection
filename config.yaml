# Laptop profile. All paths are relative to the repository root unless absolute.
profile: laptop

# Model. WORKORDER.md says "jev-1.13"; the API rejects that string and only
# accepts the versioned id "jev-1.13.0" (reports/decisions.md, D1).
model: jev-1.13.0
expected_response_model: jev-1.13.0     # abort if response.model differs
api_base: https://api.typesafe.ai
price_usd_per_mtok_input: 0.042        # docs.typesafe.ai/models; output tokens are free
price_usd_per_mtok_output: 0.0

# Spend cap over ALL Jev runs together (ledger in data/raw_responses/spend_ledger.jsonl).
# 1.0 for the first session (Andreas, 2026-10-04); WORKORDER.md default is 5.0.
MAX_USD: 1.0

SEED: 2107
bank_version: bank_v1
bank_path: src/questions/bank_v1.yaml

data_root: data
results_root: results
figures_root: figures
reports_root: reports

summary_budgets: [100, 250, 500, 1000, 2000]   # S1-b
s1_budget: 1000
s3_max_tokens: 22000     # WORKORDER says 30k; Jev counts ~1.3x tiktoken and rejects >32k (D17)
token_counter_model: gpt-4                     # make_token_counter("gpt-4"), as in the SVLM paper

# Client behaviour
concurrency: 4
timeout_s: 60
max_retries: 6
checkpoint_every: 200

# OCR
tesseract_lang: eng

# Evaluation
prevalences: [0.001, 0.01, 0.05]
operating_threshold: 0.5
learning_curve_sizes: [50, 100, 200, 500, 1000, 6160]
pilot_sites: 300

# Evidence-acquisition unit costs in seconds per site (T11b). PLACEHOLDERS until
# the fresh crawl (T17) measures them; Putra has no stored fetch/render times.
evidence_seconds:
  S0: 0.0        # URL only, nothing fetched
  S5: 1.0        # plain HTTP GET
  S1: 4.0        # rendered DOM (headless browser)
  S2: 4.5        # rendered DOM + screenshot + OCR (OCR measured: ~0.2 s)
  S3: 4.0
evidence_seconds_source: placeholder   # becomes "fresh-crawl medians (T17)" once measured

# Paper-2 reference rows: read from data/paper2/reference_rows.csv when present
# (columns: model,mode,dataset,f1,auroc,seconds_per_site,usd_per_pass,source_file).
paper2_reference_csv: data/paper2/reference_rows.csv
gpu_usd_per_hour: 0.99

# ---- v2.3 additions
cpu_usd_per_hour: 0.10                 # appendix A5 only: CPU inference converted to USD at a stated rate
voi_seconds_per_fp_unit: 60            # T20 exchange rate: one unit of c_FP equals this many acquisition seconds
voi_cost_ratios: [1, 10, 100]          # c_FN : c_FP
conformal_alphas: [0.01, 0.05]
conformal_beta: 0.05
twin_base_url: http://localhost:11434  # T09: Ollama (11434) or vLLM OpenAI-compatible server (8000)
twin_models: [gemma4:12b, qwen3.5:9b]
a5_max_usd_per_target: 1.0             # T15 A5: stop the arm when its own spend exceeds this
