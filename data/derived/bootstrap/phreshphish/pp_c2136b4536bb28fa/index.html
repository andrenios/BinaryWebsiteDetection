<title>
	Viewer Control
</title>

	<style type="text/css">
        *
        {
            padding:0; 
            margin:0;
        }
	</style>

    <script src="https://onbase-preauth.tasb.org/AppNetOBAuth/Scripts/WorkflowCommon.min.js?v=23,1,8,1000" type="text/javascript"></script>
    <script type="text/javascript">
        var _topWin = $OB.utils.returnParentWindowHostingPageName("WorkflowMain");
        var _topWin = _topWin ? _topWin : $OB.utils.returnParentWindowHostingPageName("WFStandAloneViewer");

        if (_topWin)
        {
            // Set the window title to display name of the document being displayed.
            _topWin.document.title = "";
        }

		// A custom handler to do work after the document is deleted from the viewer control 
        function PostDeletionHandler()
        {
            if (window.parent)
            {
                if (window.parent.refreshViewer)
                {
                    // We are in the main Workflow window
                    window.parent.refreshViewer();
                }
                else if (window.parent.parent && window.parent.parent.refreshViewer)
                {
                    // We are in the separeate viewer layout window
                    window.parent.parent.refreshViewer();
                }
            }
		}

		// Tells the GenericViewer to save the notes on the document
		function SaveNotes()
		{
		    var viewer = document.getElementById("ViewerCtrl");
            if (typeof viewer.SaveNotes === "function")
            {
                viewer.SaveNotes();
            }
		}

		$OB(window).addEvent("load", load);
        function load()
        {
            var activeXViewer = document.getElementById("HSIActiveXViewer");
		    if (activeXViewer == null)
		    {
		        viewerLoaded();
		    }

		    var isRelatedDocument = false;
            if(isRelatedDocument)
            {
                $OB.utils.resolve("Messenger", function (Messenger)
                {
                    var parentHitlistId = "";
                    var relatedItemsListener = function (data)
                    {
                        // disable previous/next document buttons if the related items inbox changed
                        if(data.ulcType === "WorkflowRelatedItemsList" && data.previousId === parentHitlistId)
                        {
                            GenericViewer.setDocumentAction(["nextDocument", "previousDocument"], data.currentId === parentHitlistId);
                        }
                    };

                    Messenger.subscribe("ulcInstantiate", relatedItemsListener);
                    UnloadManager.RegisterFinalizer(function ()
                    {
                        Messenger.unsubscribe("ulcInstantiate", relatedItemsListener);
                    });
                });
            }
        }

		// Called by ActiveX viewer control when it is ready
        function ViewerReadyExternal()
        {
        	viewerLoaded();
        }

        function viewerLoaded()
        {
            if (window.parent)
            {
                if (window.parent.setViewerLoaded)
                {
                    // We are in the main Workflow window
                    window.parent.setViewerLoaded();
                }
                else if(window.parent.parent && window.parent.parent.setViewerLoaded)
                {
                    // We are in the separeate viewer layout window
                    window.parent.parent.setViewerLoaded();
                }
            }
        }
    </script>
