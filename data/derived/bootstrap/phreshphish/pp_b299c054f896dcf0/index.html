adow");}}@-webkit-keyframes rightBlink{0%{filter:none;}85%{filter: url("#atn-r-shadow");}}#atn-l{-webkit-animation: leftBlink 1.1s infinite;animation: leftBlink 1.1s infinite;}#atn-c{-webkit-animation: centerBlink 1.1s 0.1s infinite;animation: centerBlink 1.1s 0.1s infinite;}#atn-r{-webkit-animation: rightBlink 1.1s 0.3s infinite;animation: rightBlink 1.1s 0.3s infinite;}@-webkit-keyframes handSpin{0%{-webkit-transform: rotateY(0deg);-webkit-transform-origin: center;transform: rotateY(0deg);transform-origin: center;}100%{-webkit-transform: rotateY(180deg);-webkit-transform-origin: center;transform: rotateY(180deg);transform-origin: center;}}/* #left-arm{animation: handSpin 1s linear infinite;} *//* #right-arm{animation: handSpin 1s linear infinite;} */@-webkit-keyframes eyeBlink{7% { -webkit-transform: scaley(1); transform: scaley(1); } 10% { -webkit-transform: scaley(0.2); -webkit-transform: scaley(0.2);transform: scaley(0.2);transform-origin: center center;} 13% { -webkit-transform: scaley;transform: scaley(1);}}.eyes{-webkit-animation: eyeBlink 3s infinite;animation: eyeBlink 3s infinite;}.message{background-color: #BEE3F7;margin-top: -5px;padding: 15px;}p,span{font-size: 1.5rem;font-family: consolas;display: inline;}@-webkit-keyframes dotBlink{0%{opacity: 0;}75%{opacity: 1;}}#dot1{-webkit-animation: dotBlink 1s infinite;animation: dotBlink 1s infinite;}#dot2{-webkit-animation: dotBlink 1s .2s infinite;animation: dotBlink 1s .2s infinite;}#dot3{-webkit-animation: dotBlink 1s .4s infinite;animation: dotBlink 1s .4s infinite;}</style></body></html>
