        if (ajaxCheckStatus) {
            return;
        }
        ajaxCheckStatus = true;

        $.ajax({
            url: "/ajax/captcha.php",
            dataType: "json",
            type: "POST",
            data: "check=true",
            success: function (return_data) {
                if(return_data["status"]){
                    clearInterval(interval);
                    location.reload();
                    setTimeout(function () {

                    }, 1000);
                    clearInterval(interval);
                }
            },
            complete: function () {
                ajaxCheckStatus = false;

        });
    },2000);
